[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apforge"
version = "0.1.0"
description = "APforge core learning engine: USE -> OBSERVE -> EVALUATE -> REFLECT -> REMEMBER -> CHANGE STRATEGY -> USE AGAIN"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.26",
]

[tool.setuptools.packages.find]
include = ["apforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"